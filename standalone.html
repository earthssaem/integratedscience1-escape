<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060b1a">
<!-- 이 파일은 CSS/JS가 모두 포함된 단일 실행 파일입니다. 이 파일 하나만 다운로드해 브라우저로 열면 바로 실행됩니다. build.js 로 자동 생성되므로 직접 편집하지 마세요. -->
<title>통합과학 방탈출: 138억 년의 여정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   통합과학 방탈출: 138억 년의 여정 — 공통 스타일
   ============================================================ */

:root {
  --bg0: #050914;
  --bg1: #0a1330;
  --bg2: #101d42;
  --panel: rgba(16, 32, 66, 0.72);
  --panel-line: rgba(93, 205, 255, 0.35);
  --glow: #52d8ff;
  --accent: #37e0c8;
  --warn: #ffab52;
  --danger: #ff6b6b;
  --ok: #55e6a5;
  --text: #e9f2ff;
  --text-dim: #a9bdd9;
  --radius: 14px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
  --font: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 80% -10%, #142a5e 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #0d2148 0%, transparent 55%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  background-attachment: fixed;
  overflow-x: hidden;
}

.noscript {
  padding: 2rem;
  text-align: center;
  color: #fff;
}

.hidden { display: none !important; }

button { font-family: inherit; }

h1, h2, h3 { line-height: 1.3; }

/* ---------- 버튼 공통 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4em;
  min-height: 44px;
  padding: 0.5em 1.1em;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  background: rgba(40, 70, 130, 0.55);
  border: 1px solid var(--panel-line);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s, transform 0.08s;
}
.btn:hover { background: rgba(60, 100, 175, 0.65); box-shadow: 0 0 12px rgba(82, 216, 255, 0.35); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, button:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
  outline: 3px solid var(--glow);
  outline-offset: 2px;
}
.btn-primary {
  background: linear-gradient(135deg, #1e7fae, #14b8a6);
  border-color: rgba(150, 240, 255, 0.6);
}
.btn-primary:hover { background: linear-gradient(135deg, #2596cc, #17d4bf); }
.btn-ghost { background: transparent; border-color: rgba(140, 170, 220, 0.35); }
.btn-big { font-size: 1.12rem; min-height: 52px; padding: 0.6em 1.6em; }
.btn-small { min-height: 36px; font-size: 0.9rem; padding: 0.3em 0.8em; }
.btn-warn { background: rgba(150, 80, 20, 0.5); border-color: rgba(255, 171, 82, 0.6); }

/* ============================================================
   상단 바
   ============================================================ */
#topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  padding: 0.5rem 1rem;
  background: rgba(6, 11, 26, 0.92);
  border-bottom: 1px solid var(--panel-line);
  backdrop-filter: blur(6px);
}
.tb-left { display: flex; align-items: center; gap: 0.6rem; }
.tb-logo { font-size: 1.5rem; }
.tb-titles { display: flex; flex-direction: column; line-height: 1.2; }
.tb-titles strong { font-size: 1rem; color: var(--glow); letter-spacing: 0.02em; }
#tb-loc { font-size: 0.85rem; color: var(--text-dim); }
.tb-mid { display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 220px; }
.tb-progress {
  flex: 1;
  max-width: 260px;
  height: 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  border: 1px solid rgba(120, 160, 220, 0.3);
}
#tb-progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #1e9be0, var(--accent));
  transition: width 0.4s;
}
#tb-progress-text { font-size: 0.85rem; color: var(--text-dim); min-width: 2.6em; }
#tb-chips { display: flex; gap: 5px; }
.chip-dot {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 700;
  border-radius: 6px;
  border: 1px solid rgba(140, 170, 220, 0.4);
  color: rgba(180, 200, 230, 0.35);
  background: rgba(255, 255, 255, 0.05);
}
.chip-dot.got {
  color: #06251f;
  background: linear-gradient(135deg, #59f2c8, #35c3ff);
  border-color: #9ffbe4;
  box-shadow: 0 0 8px rgba(85, 230, 190, 0.7);
}
.tb-right { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
#tb-time {
  font-variant-numeric: tabular-nums;
  font-size: 0.9rem;
  color: var(--text-dim);
  padding: 0.2em 0.6em;
  border: 1px solid rgba(120, 160, 220, 0.3);
  border-radius: 8px;
}

/* ============================================================
   화면 공통
   ============================================================ */
.screen { min-height: calc(100vh - 64px); }

/* ============================================================
   시작 화면
   ============================================================ */
#screen-start {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem 1rem;
  overflow: hidden;
}
.start-stars, .start-stars::before, .start-stars::after {
  content: "";
  position: absolute;
  inset: -50%;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, #cfe9ff 60%, transparent),
    radial-gradient(1px 1px at 55% 15%, #9fd0ff 60%, transparent),
    radial-gradient(2px 2px at 80% 45%, #ffffff 60%, transparent),
    radial-gradient(1px 1px at 35% 70%, #b9e6ff 60%, transparent),
    radial-gradient(1.5px 1.5px at 70% 80%, #e0f4ff 60%, transparent),
    radial-gradient(1px 1px at 10% 55%, #8fc6ff 60%, transparent),
    radial-gradient(1.5px 1.5px at 90% 20%, #d5eeff 60%, transparent),
    radial-gradient(1px 1px at 45% 90%, #ffffff 60%, transparent);
  background-size: 520px 520px;
  animation: drift 90s linear infinite;
  opacity: 0.7;
}
.start-stars::before { background-size: 780px 780px; animation-duration: 140s; opacity: 0.5; }
.start-stars::after { background-size: 340px 340px; animation-duration: 60s; opacity: 0.35; }
@keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-260px, -180px, 0); } }

.start-card {
  position: relative;
  z-index: 2;
  max-width: 620px;
  width: 100%;
  padding: 2.2rem 2rem;
  text-align: center;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 20px;
  box-shadow: var(--shadow), inset 0 0 60px rgba(50, 130, 220, 0.08);
  backdrop-filter: blur(8px);
}
.start-kicker {
  margin: 0 0 0.4rem;
  font-size: 0.78rem;
  letter-spacing: 0.35em;
  color: var(--accent);
}
.start-title {
  margin: 0;
  font-size: clamp(1.6rem, 5vw, 2.5rem);
  text-shadow: 0 0 24px rgba(82, 216, 255, 0.45);
}
.start-title span { color: var(--glow); }
.start-sub { color: var(--text-dim); margin: 0.8rem 0 1.4rem; }
.start-info {
  list-style: none;
  margin: 0 0 1.6rem;
  padding: 0.9rem 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1.4rem;
  justify-content: center;
  background: rgba(8, 16, 36, 0.6);
  border: 1px solid rgba(93, 205, 255, 0.2);
  border-radius: 12px;
  font-size: 0.93rem;
}
.start-info strong { color: var(--accent); margin-right: 0.4em; font-weight: 700; }
.start-btns { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; }
.start-foot { margin: 1.4rem 0 0; font-size: 0.8rem; color: rgba(170, 190, 220, 0.65); }

/* ============================================================
   프롤로그
   ============================================================ */
#screen-prologue {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1.5rem;
  overflow: hidden;
}
#pro-fx { position: absolute; inset: 0; transition: background 0.6s; }
#pro-fx.fx-lab { background: radial-gradient(700px 400px at 50% 60%, rgba(40, 90, 160, 0.35), transparent); }
#pro-fx.fx-power { background: radial-gradient(500px 500px at 50% 55%, rgba(55, 224, 200, 0.3), transparent); animation: pulse-bg 1.6s ease-in-out infinite; }
#pro-fx.fx-warn { background: radial-gradient(600px 400px at 50% 50%, rgba(255, 100, 60, 0.28), transparent); animation: pulse-bg 0.7s ease-in-out infinite; }
#pro-fx.fx-flash { background: radial-gradient(900px 900px at 50% 50%, rgba(240, 250, 255, 0.5), rgba(90, 190, 255, 0.2) 55%, transparent); animation: shake-fx 0.5s linear infinite; }
#pro-fx.fx-chips { background: radial-gradient(700px 500px at 50% 45%, rgba(85, 230, 190, 0.22), transparent); }
#pro-fx.fx-dark { background: #01030a; }
#pro-fx.fx-arrive { background: radial-gradient(800px 600px at 50% 40%, rgba(80, 130, 255, 0.25), transparent); }
@keyframes pulse-bg { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes shake-fx { 0%,100% { transform: translate(0,0);} 25% { transform: translate(-6px,3px);} 50% { transform: translate(5px,-4px);} 75% { transform: translate(-3px,-3px);} }

.pro-box {
  position: relative;
  z-index: 2;
  max-width: 640px;
  width: 100%;
  padding: 2rem;
  background: rgba(7, 13, 30, 0.88);
  border: 1px solid var(--panel-line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  text-align: center;
}
.pro-step { color: var(--accent); font-size: 0.8rem; letter-spacing: 0.25em; margin: 0; }
#pro-title { font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 0.5rem 0 0.8rem; color: var(--glow); }
#pro-desc { color: var(--text); min-height: 4.2em; margin: 0 0 1.4rem; font-size: 1.05rem; }
.pro-btns { display: flex; justify-content: space-between; gap: 0.8rem; }

/* ============================================================
   게임 레이아웃
   ============================================================ */
#screen-game { padding: 0.9rem; }
#game-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 0.9rem;
  max-width: 1500px;
  margin: 0 auto;
}
#objective-bar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.9rem;
  margin-bottom: 0.7rem;
  background: rgba(10, 22, 48, 0.85);
  border: 1px solid rgba(85, 230, 165, 0.35);
  border-left: 4px solid var(--ok);
  border-radius: 10px;
  font-size: 0.97rem;
}
.obj-tag {
  flex-shrink: 0;
  font-size: 0.75rem;
  font-weight: 700;
  color: #06251f;
  background: var(--ok);
  border-radius: 6px;
  padding: 0.1em 0.6em;
}

/* ---------- 방 화면 ---------- */
#room-view {
  position: relative;
  min-height: 560px;
  border-radius: var(--radius);
  border: 1px solid var(--panel-line);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.room-scene { position: absolute; inset: 0; }
.scene-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.room-title-tag {
  position: absolute;
  top: 12px; left: 14px;
  z-index: 3;
  padding: 0.25em 0.9em;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--glow);
  background: rgba(5, 10, 24, 0.75);
  border: 1px solid var(--panel-line);
  border-radius: 999px;
  pointer-events: none;
}

/* 방 테마 배경 */
.theme-r1 { background: linear-gradient(160deg, #05070f 0%, #0a1026 45%, #131b3f 100%); }
.theme-r2 { background: linear-gradient(150deg, #0d0517 0%, #1d0f38 45%, #351a52 100%); }
.theme-r3 { background: linear-gradient(160deg, #03101f 0%, #06263f 50%, #0a3a52 100%); }
.theme-r4 { background: linear-gradient(160deg, #140a06 0%, #2a140c 45%, #401c0e 100%); }
.theme-final { background: radial-gradient(700px 500px at 50% 45%, #123, #05070f 75%); }

/* 오브젝트 버튼 */
.room-obj {
  position: absolute;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 118px;
  padding: 10px 6px 8px;
  color: var(--text);
  background: rgba(10, 20, 44, 0.55);
  border: 1px solid rgba(120, 170, 230, 0.28);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s, filter 0.15s;
  transform: translate(-50%, -50%);
}
.room-obj:hover, .room-obj:focus-visible {
  border-color: var(--glow);
  background: rgba(20, 40, 80, 0.75);
  box-shadow: 0 0 14px rgba(82, 216, 255, 0.4);
}
.room-obj .obj-icon { width: 40px; height: 40px; color: var(--glow); }
.room-obj .obj-icon svg { width: 100%; height: 100%; }
.room-obj .obj-name { font-size: 0.78rem; font-weight: 600; text-align: center; line-height: 1.25; }
.obj-badge {
  position: absolute;
  top: -8px; right: -8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  font-size: 0.75rem;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
}
.room-obj.st-locked { filter: grayscale(0.7) brightness(0.62); }
.room-obj.st-locked .obj-badge { background: rgba(120, 60, 20, 0.9); }
.room-obj.st-done .obj-badge { background: rgba(20, 120, 80, 0.95); }
.room-obj.st-ready .obj-badge { background: rgba(30, 90, 160, 0.9); }
.room-obj.obj-door {
  width: 132px;
  border-color: rgba(255, 171, 82, 0.55);
  background: rgba(45, 25, 8, 0.6);
}
.room-obj.obj-door .obj-icon { color: var(--warn); }
.room-obj.obj-door:hover, .room-obj.obj-door:focus-visible {
  border-color: var(--warn);
  box-shadow: 0 0 16px rgba(255, 171, 82, 0.5);
}

/* ---------- 인벤토리 ---------- */
#side-panel { min-width: 0; }
#inv-details {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 0.3rem 0.8rem 0.8rem;
}
#inv-details summary {
  cursor: pointer;
  font-weight: 700;
  padding: 0.6rem 0.2rem;
  color: var(--glow);
  user-select: none;
}
.inv-help { font-size: 0.8rem; color: var(--text-dim); margin: 0 0 0.6rem; }
.inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.inv-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 4px;
  min-height: 76px;
  color: var(--text);
  background: rgba(15, 30, 62, 0.7);
  border: 1px solid rgba(110, 160, 220, 0.25);
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.72rem;
  text-align: center;
  line-height: 1.2;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.inv-item:hover, .inv-item:focus-visible { border-color: var(--glow); box-shadow: 0 0 10px rgba(82, 216, 255, 0.3); }
.inv-item .inv-icon { width: 28px; height: 28px; color: var(--accent); }
.inv-item .inv-icon svg { width: 100%; height: 100%; }
.inv-item.locked { opacity: 0.45; filter: grayscale(1); }
.inv-item.locked .inv-icon { color: #7c8aa5; }
.inv-item.used { border-style: dashed; opacity: 0.75; }
.inv-badge {
  position: absolute;
  top: -6px; right: -5px;
  font-size: 0.6rem;
  font-weight: 700;
  padding: 0.1em 0.45em;
  border-radius: 999px;
  background: #2b4a86;
  border: 1px solid rgba(255, 255, 255, 0.35);
}
.inv-item.used .inv-badge { background: #555f75; }
.inv-count {
  position: absolute;
  bottom: 4px; right: 6px;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--accent);
}

/* ============================================================
   모달
   ============================================================ */
#modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(2, 5, 14, 0.78);
  backdrop-filter: blur(3px);
}
.modal {
  width: min(880px, 100%);
  max-height: min(92vh, 100%);
  overflow-y: auto;
  background: linear-gradient(180deg, #0d1834, #0a1226);
  border: 1px solid var(--panel-line);
  border-radius: 16px;
  box-shadow: var(--shadow), 0 0 40px rgba(60, 160, 255, 0.15);
  animation: modal-in 0.22s ease-out;
}
@keyframes modal-in { from { transform: translateY(14px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
  padding: 0.9rem 1.1rem 0.7rem;
  background: rgba(10, 18, 38, 0.96);
  border-bottom: 1px solid rgba(93, 205, 255, 0.22);
}
.modal-head h2 { margin: 0; font-size: 1.15rem; color: var(--glow); }
.modal-sub { margin: 0.2rem 0 0; font-size: 0.85rem; color: var(--text-dim); }
.modal-head-btns { display: flex; gap: 0.4rem; flex-shrink: 0; }
.modal-body { padding: 1rem 1.1rem 1.3rem; }
.modal-body p { margin: 0.4rem 0; }

/* 힌트 팝업 */
#hint-pop {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 200;
  width: min(360px, calc(100vw - 32px));
  padding: 0.8rem 1rem;
  background: #141f0a00;
  background: linear-gradient(180deg, #1c2a10, #131d0b);
  border: 1px solid rgba(220, 240, 130, 0.5);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
#hint-pop .hint-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
#hint-pop strong { color: #e8f59a; }
#hint-pop ol { margin: 0.3rem 0 0.6rem; padding-left: 1.3rem; }
#hint-pop li { margin: 0.35rem 0; font-size: 0.92rem; }
#hint-pop .hint-max { font-size: 0.8rem; color: var(--text-dim); margin: 0; }

/* 토스트 */
#toast-root {
  position: fixed;
  left: 50%;
  bottom: 22px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  padding: 0.55em 1.2em;
  font-size: 0.93rem;
  color: #eafcff;
  background: rgba(12, 40, 60, 0.92);
  border: 1px solid var(--panel-line);
  border-radius: 999px;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity: 1; transform: none; }

/* ============================================================
   퍼즐 공통
   ============================================================ */
.puzzle-prompt {
  padding: 0.7rem 0.9rem;
  margin: 0 0 0.8rem;
  background: rgba(20, 44, 80, 0.55);
  border: 1px solid rgba(93, 205, 255, 0.28);
  border-radius: 10px;
  font-size: 0.98rem;
}
.puzzle-note { font-size: 0.8rem; color: var(--text-dim); margin: 0.3rem 0 0.7rem; }
.pool-label { font-size: 0.82rem; color: var(--text-dim); margin: 0.8rem 0 0.4rem; }
.puzzle-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.9rem; }

.game-card {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0.45em 0.9em;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  background: linear-gradient(180deg, rgba(45, 80, 140, 0.75), rgba(28, 52, 100, 0.75));
  border: 1px solid rgba(130, 190, 250, 0.45);
  border-radius: 10px;
  cursor: grab;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
}
.game-card:hover { border-color: var(--glow); box-shadow: 0 0 10px rgba(82, 216, 255, 0.35); }
.game-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(55, 224, 200, 0.45), 0 0 14px rgba(55, 224, 200, 0.5);
  transform: translateY(-2px);
}
.game-card:disabled { cursor: default; opacity: 0.85; }
.card-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 56px;
  padding: 8px;
  background: rgba(5, 10, 24, 0.55);
  border: 1px dashed rgba(120, 160, 220, 0.35);
  border-radius: 10px;
}

/* 배열(순서) 퍼즐 */
.order-slots { display: flex; flex-wrap: wrap; gap: 8px; }
.order-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 128px;
  flex: 1 1 128px;
  max-width: 220px;
}
.slot-num {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.1em;
}
.slot-drop {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 4px;
  background: rgba(8, 18, 40, 0.7);
  border: 1.5px dashed rgba(85, 230, 165, 0.4);
  border-radius: 10px;
}
.slot-drop .game-card { width: 100%; }
.slot-drop.drag-over { border-color: var(--accent); background: rgba(35, 90, 90, 0.4); }
.order-slot.fixed .locked-card {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.4em 0.8em;
  font-weight: 700;
  font-size: 0.95rem;
  text-align: center;
  color: #cfeee2;
  background: rgba(25, 70, 55, 0.6);
  border: 1.5px solid rgba(85, 230, 165, 0.55);
  border-radius: 10px;
}

/* 분류(배치) 퍼즐 */
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.bin {
  padding: 8px;
  background: rgba(8, 18, 40, 0.65);
  border: 1.5px dashed rgba(120, 170, 230, 0.4);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.bin:hover, .bin.drag-over { border-color: var(--accent); background: rgba(20, 50, 70, 0.55); }
.bin-head { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; text-align: center; }
.bin-label { font-weight: 700; font-size: 0.95rem; color: var(--glow); }
.bin-desc { font-size: 0.78rem; color: var(--text-dim); }
.bin-drop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; align-content: flex-start; }
.bin-drop .game-card { font-size: 0.85rem; min-height: 40px; }
.bin-svg { width: 100%; max-width: 280px; }

/* 피드백 */
.feedback {
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  margin-top: 0.8rem;
  border-radius: 10px;
  font-size: 0.95rem;
}
.feedback:empty { display: none; }
.feedback p { margin: 0.15rem 0 0; }
.fb-icon {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-weight: 900;
}
.fb-err { padding: 0.7rem 0.9rem; background: rgba(90, 25, 25, 0.55); border: 1px solid rgba(255, 107, 107, 0.55); }
.fb-err .fb-icon { background: var(--danger); color: #2a0505; }
.fb-ok { padding: 0.7rem 0.9rem; background: rgba(15, 75, 55, 0.55); border: 1px solid rgba(85, 230, 165, 0.6); }
.fb-ok .fb-icon { background: var(--ok); color: #06251f; }
.feedback.pop { animation: fb-pop 0.35s; }
@keyframes fb-pop { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } 100% { transform: none; } }

/* 숫자 키패드 */
.code-display { display: flex; gap: 8px; justify-content: center; margin: 0.8rem 0; }
.code-cell {
  width: 52px; height: 62px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.7rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--warn);
  background: #05080f;
  border: 2px solid rgba(255, 171, 82, 0.45);
  border-radius: 10px;
  text-shadow: 0 0 10px rgba(255, 171, 82, 0.7);
}
.code-cell.cur { border-color: var(--warn); box-shadow: 0 0 12px rgba(255, 171, 82, 0.45); }
.keypad {
  display: grid;
  grid-template-columns: repeat(3, minmax(72px, 96px));
  gap: 8px;
  justify-content: center;
  margin: 0.6rem 0;
}
.key {
  min-height: 56px;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  background: rgba(30, 55, 100, 0.7);
  border: 1px solid rgba(130, 180, 240, 0.4);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.12s, box-shadow 0.12s;
}
.key:hover { background: rgba(50, 85, 150, 0.8); box-shadow: 0 0 10px rgba(82, 216, 255, 0.35); }
.key-ok { background: rgba(20, 110, 80, 0.75); border-color: rgba(85, 230, 165, 0.6); font-size: 1.05rem; }
.key-del { background: rgba(110, 50, 25, 0.7); border-color: rgba(255, 171, 82, 0.5); font-size: 1.05rem; }

/* 회전식/사이클 선택기 */
.cycler-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 0.8rem 0; }
.cycler {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px;
  background: rgba(8, 18, 40, 0.7);
  border: 1px solid rgba(120, 170, 230, 0.35);
  border-radius: 12px;
  min-width: 132px;
}
.cyc-label { font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-align: center; }
.cyc-ctrl { display: flex; align-items: center; gap: 6px; }
.cyc-btn {
  width: 40px; height: 44px;
  font-size: 1.1rem;
  color: var(--text);
  background: rgba(40, 70, 130, 0.6);
  border: 1px solid rgba(130, 180, 240, 0.4);
  border-radius: 8px;
  cursor: pointer;
}
.cyc-btn:hover { background: rgba(60, 100, 175, 0.7); }
.cyc-val {
  min-width: 96px;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 8px;
  font-weight: 800;
  text-align: center;
  background: #05080f;
  border: 2px solid rgba(85, 230, 165, 0.4);
  border-radius: 10px;
  color: var(--accent);
}
.cyc-val .cyc-icon { width: 30px; height: 30px; }
.cyc-val .cyc-icon svg { width: 100%; height: 100%; }
.cyc-val .cyc-text { font-size: 0.85rem; }
.cyc-val.num { font-size: 1.9rem; color: var(--warn); border-color: rgba(255, 171, 82, 0.45); }

/* 세그먼트(선택형) */
.seg-group { display: flex; flex-direction: column; gap: 6px; margin: 0.5rem 0 0.9rem; }
.seg-title { font-weight: 700; font-size: 0.95rem; color: var(--glow); }
.seg-desc { font-size: 0.82rem; color: var(--text-dim); margin: 0 0 0.2rem; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-btn {
  flex: 1 1 150px;
  min-height: 52px;
  padding: 0.4em 0.7em;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text);
  background: rgba(20, 38, 74, 0.7);
  border: 1.5px solid rgba(120, 170, 230, 0.35);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.seg-btn:hover { border-color: var(--glow); }
.seg-btn.on {
  border-color: var(--accent);
  background: rgba(22, 78, 70, 0.75);
  box-shadow: 0 0 10px rgba(55, 224, 200, 0.4);
}
.seg-btn.on::before { content: "✔ "; color: var(--ok); }
.seg-arrows { display: block; font-size: 1.2rem; letter-spacing: 0.15em; color: var(--warn); }

/* ---------- 입자 퍼즐 (핵합성/핵융합) ---------- */
.particle-stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.particle-zone {
  position: relative;
  min-height: 210px;
  padding: 10px;
  background: rgba(4, 8, 20, 0.75);
  border: 1.5px dashed rgba(120, 170, 230, 0.4);
  border-radius: 12px;
}
.particle-zone.assembly { border-color: rgba(255, 171, 82, 0.55); }
.pz-title { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
.pz-body { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.particle {
  width: 44px; height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  font-weight: 800;
  border-radius: 50%;
  cursor: grab;
  border: 2px solid rgba(255, 255, 255, 0.35);
  transition: box-shadow 0.12s, transform 0.1s;
  color: #fff;
}
.particle:hover { box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
.particle:disabled { cursor: default; }
.pt-p { background: radial-gradient(circle at 32% 30%, #ff9d7e, #d23f2f 75%); }
.pt-n { background: radial-gradient(circle at 32% 30%, #cfd8e6, #6d7c94 75%); color: #1a2230; }
.pt-e {
  width: 18px; height: 18px;
  font-size: 0.55rem;
  background: radial-gradient(circle at 35% 30%, #b1f4ff, #2196c9 75%);
  border-width: 1px;
  cursor: help;
  animation: e-wiggle 2.4s ease-in-out infinite;
}
.pt-wave { color: #ffe28a; font-size: 1.1rem; cursor: help; background: none; border: none; width: auto; height: auto; }
@keyframes e-wiggle { 0%,100% { transform: translate(0,0);} 30% { transform: translate(3px,-4px);} 60% { transform: translate(-4px,3px);} }
.he-core {
  display: inline-grid;
  grid-template-columns: 22px 22px;
  gap: 2px;
  padding: 6px;
  border-radius: 50%;
  background: rgba(255, 220, 120, 0.12);
  border: 2px solid #ffd97a;
  box-shadow: 0 0 18px rgba(255, 217, 122, 0.75);
  animation: he-glow 1.6s ease-in-out infinite;
}
.he-core span { width: 22px; height: 22px; border-radius: 50%; }
.he-core .hp { background: radial-gradient(circle at 32% 30%, #ff9d7e, #d23f2f 75%); }
.he-core .hn { background: radial-gradient(circle at 32% 30%, #cfd8e6, #6d7c94 75%); }
@keyframes he-glow { 0%,100% { box-shadow: 0 0 12px rgba(255,217,122,0.5);} 50% { box-shadow: 0 0 26px rgba(255,217,122,0.95);} }
.h-label {
  position: relative;
}
.h-label::after {
  content: "수소 원자핵";
  position: absolute;
  left: 50%; bottom: -14px;
  transform: translateX(-50%);
  font-size: 0.55rem;
  font-weight: 700;
  color: #ffc9a3;
  white-space: nowrap;
}
.mass-calc { display: flex; flex-direction: column; gap: 10px; margin: 0.6rem 0; }
.mass-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(8, 18, 40, 0.7);
  border: 1px solid rgba(120, 170, 230, 0.3);
  border-radius: 10px;
  font-size: 0.98rem;
}
.mass-row input {
  width: 76px;
  min-height: 44px;
  font-size: 1.2rem;
  font-weight: 800;
  text-align: center;
  color: var(--warn);
  background: #05080f;
  border: 2px solid rgba(255, 171, 82, 0.45);
  border-radius: 8px;
  font-family: inherit;
}
.mass-row input:focus-visible { outline: 3px solid var(--glow); outline-offset: 1px; }
.ratio-sep { font-size: 1.4rem; font-weight: 900; color: var(--text-dim); }

/* ---------- 빛의 탈출 실험 ---------- */
.chambers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chamber {
  position: relative;
  min-height: 180px;
  padding: 8px;
  background: rgba(3, 7, 18, 0.85);
  border: 1.5px solid rgba(120, 170, 230, 0.35);
  border-radius: 12px;
  overflow: hidden;
}
.chamber h4 { margin: 0 0 4px; font-size: 0.88rem; color: var(--glow); }
.chamber .ch-deco { position: absolute; inset: 28px 8px 42px; pointer-events: none; }
.ch-particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; }
.ch-particle.big { width: 18px; height: 18px; }
.beam-dot {
  position: absolute;
  top: 50%; left: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff7ae;
  box-shadow: 0 0 12px #fff7ae, 0 0 22px rgba(255, 247, 174, 0.7);
  opacity: 0;
}
.chamber.fired-zig .beam-dot { opacity: 1; animation: beam-zig 2.4s linear forwards; }
.chamber.fired-straight .beam-dot { opacity: 1; animation: beam-straight 1.6s linear forwards; }
@keyframes beam-zig {
  0%   { transform: translate(0, 0); }
  15%  { transform: translate(34px, -34px); }
  30%  { transform: translate(20px, 30px); }
  45%  { transform: translate(60px, -14px); }
  60%  { transform: translate(44px, 38px); }
  75%  { transform: translate(80px, 6px); }
  90%  { transform: translate(62px, -30px); }
  100% { transform: translate(88px, 14px); opacity: 0.9; }
}
@keyframes beam-straight {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(100% * 14)); transform: translateX(260px); opacity: 1; }
}
.ch-btn-row { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: center; }
.cmp-table { width: 100%; border-collapse: collapse; margin: 0.7rem 0; font-size: 0.9rem; }
.cmp-table th, .cmp-table td { padding: 0.5em 0.6em; border: 1px solid rgba(120, 170, 230, 0.3); text-align: left; vertical-align: top; }
.cmp-table th { background: rgba(25, 50, 95, 0.6); color: var(--glow); }
.cmp-table td:first-child { font-weight: 700; color: var(--accent); white-space: nowrap; }
.table-wrap { overflow-x: auto; }

/* 빈칸 채우기 문장 */
.blank-sentence {
  padding: 0.9rem 1rem;
  margin: 0.6rem 0;
  font-size: 1.02rem;
  line-height: 2.4;
  background: rgba(8, 18, 40, 0.7);
  border: 1px solid rgba(120, 170, 230, 0.3);
  border-radius: 12px;
}
.blank-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 108px;
  min-height: 42px;
  margin: 0 4px;
  padding: 2px 6px;
  vertical-align: middle;
  background: rgba(4, 8, 20, 0.8);
  border: 1.5px dashed rgba(255, 171, 82, 0.55);
  border-radius: 8px;
  cursor: pointer;
}
.blank-slot .game-card { min-height: 36px; font-size: 0.88rem; padding: 0.2em 0.6em; }
.blank-slot.drag-over { border-color: var(--warn); background: rgba(70, 45, 12, 0.5); }

/* ---------- 스펙트럼 ---------- */
.spec-svg { display: block; width: 100%; max-width: 300px; height: auto; border-radius: 6px; }
.spec-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
.spec-name { min-width: 130px; font-weight: 700; font-size: 0.9rem; }
.elem-toggle-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.6rem; }

/* ---------- 지도 퍼즐 ---------- */
.mapwrap { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
.mapwrap svg { display: block; width: 100%; height: auto; border-radius: 10px; }
.map-zone {
  position: absolute;
  border: 2px dashed rgba(180, 200, 230, 0.6);
  border-radius: 12px;
  background: rgba(70, 110, 180, 0.12);
  color: #dfeaff;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 3px 7px;
  transition: background 0.12s, border-color 0.12s;
}
.map-zone:hover { border-color: var(--glow); }
.map-zone.on {
  border: 2.5px solid var(--warn);
  background: rgba(255, 171, 82, 0.22);
  box-shadow: 0 0 12px rgba(255, 171, 82, 0.4);
}
.map-zone.on::after { content: "✔"; margin-left: 4px; color: var(--warn); }
.map-legend { display: flex; gap: 1.2rem; justify-content: center; font-size: 0.85rem; color: var(--text-dim); margin: 0.5rem 0; flex-wrap: wrap; }
.lg-quake, .lg-volcano { display: inline-block; margin-right: 5px; }
.lg-quake { width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; }
.lg-volcano { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #ffab52; }
.belt-line { opacity: 0; transition: opacity 0.8s; }
.belts-shown .belt-line { opacity: 1; }

/* ---------- 성공 연출 ---------- */
.success-panel {
  margin-top: 0.9rem;
  padding: 1rem;
  text-align: center;
  background: rgba(12, 60, 45, 0.5);
  border: 1px solid rgba(85, 230, 165, 0.55);
  border-radius: 12px;
  animation: modal-in 0.3s ease-out;
}
.success-panel h3 { margin: 0 0 0.4rem; color: var(--ok); }
.success-panel .success-icon { font-size: 2rem; display: block; margin-bottom: 0.3rem; animation: he-glow 1.8s infinite; border-radius: 50%; width: 64px; height: 64px; line-height: 64px; margin-left: auto; margin-right: auto; }
.nova-flash { animation: nova-flash 1.4s ease-out; }
@keyframes nova-flash {
  0% { box-shadow: inset 0 0 0 rgba(255, 255, 255, 0); }
  25% { box-shadow: inset 0 0 140px rgba(255, 245, 220, 0.95); }
  100% { box-shadow: inset 0 0 0 rgba(255, 255, 255, 0); }
}

/* 물 순환 애니메이션 */
.orbit-box { position: relative; width: 150px; height: 150px; margin: 0.5rem auto; }
.orbit-box .orbit-earth { position: absolute; inset: 25px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4dc3ff, #0a5c9c 70%); box-shadow: 0 0 20px rgba(77, 195, 255, 0.5); }
.orbit-box .orbit-drop {
  position: absolute;
  top: 50%; left: 50%;
  width: 16px; height: 16px;
  margin: -8px;
  border-radius: 50% 50% 50% 0;
  transform-origin: center;
  background: #aef1ff;
  box-shadow: 0 0 10px #aef1ff;
  animation: orbit 3s linear infinite;
}
@keyframes orbit {
  from { transform: rotate(0deg) translateX(62px) rotate(45deg); }
  to { transform: rotate(360deg) translateX(62px) rotate(405deg); }
}

/* ---------- 최종(타임머신) ---------- */
.final-scene { position: relative; z-index: 4; padding: 1.2rem; max-width: 880px; margin: 0 auto; }
.final-scene h2 { text-align: center; color: var(--glow); margin: 0.4rem 0 0.2rem; }
.final-lead { text-align: center; color: var(--text-dim); margin: 0 0 1rem; }
.machine-svg { display: block; width: min(340px, 70%); margin: 0 auto 0.8rem; }
.final-panel {
  padding: 1rem;
  background: rgba(8, 16, 36, 0.82);
  border: 1px solid var(--panel-line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}

/* 시간 터널 오버레이 */
#fx-overlay {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #010208;
  overflow: hidden;
}
.tunnel {
  position: absolute;
  inset: -60%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(82, 216, 255, 0.0) 0 34px, rgba(82, 216, 255, 0.35) 36px 38px),
    radial-gradient(circle at 50% 50%, #b3ecff 0%, #114 30%, #010208 70%);
  animation: tunnel-zoom 2.4s ease-in forwards;
}
@keyframes tunnel-zoom {
  0% { transform: scale(0.4); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: scale(2.4); opacity: 1; }
}
.tunnel-text {
  position: relative;
  z-index: 2;
  font-size: clamp(1.2rem, 4vw, 2rem);
  font-weight: 800;
  color: #eafcff;
  text-shadow: 0 0 24px rgba(82, 216, 255, 0.9);
  animation: pulse-bg 1s infinite;
}

/* ---------- 결과 화면 ---------- */
#screen-result { display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
.result-card {
  max-width: 680px;
  width: 100%;
  padding: 2rem;
  text-align: center;
  background: var(--panel);
  border: 1px solid rgba(85, 230, 165, 0.5);
  border-radius: 20px;
  box-shadow: var(--shadow), 0 0 50px rgba(85, 230, 165, 0.12);
}
.result-card h2 { font-size: 2rem; color: var(--ok); margin: 0.2rem 0 1rem; text-shadow: 0 0 22px rgba(85, 230, 165, 0.6); }
.result-story {
  text-align: left;
  padding: 1rem 1.2rem;
  margin: 1rem 0;
  background: rgba(8, 16, 36, 0.7);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  font-size: 0.98rem;
}
.result-story p { margin: 0.55rem 0; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 1.2rem 0; }
.stat {
  padding: 0.8rem 0.5rem;
  background: rgba(8, 16, 36, 0.7);

/* ============================================================
   engine.js — 게임 상태, 저장, 사운드, 모달, 인벤토리, 퍼즐 공통 빌더

/* ---------- DOM 유틸 ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function svgIcon(name, cls = 'obj-icon') {
  return `<span class="${cls}" aria-hidden="true">${ICONS[name] || ''}</span>`;
}
function fmtTime(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60);
  const sec = s % 60;
  if (m >= 60) {
    const h = Math.floor(m / 60);
    return `${h}시간 ${m % 60}분`;
  }
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

/* ---------- 사운드 (Web Audio API) ---------- */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      } catch (e) { /* 사운드 미지원 환경 */ }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', gain = 0.07, delay = 0) {
    if (!state.settings.sound) return;
    this.ensure();
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  click() { this.tone(660, 0.07, 'triangle', 0.045); },
  success() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.2, 'sine', 0.07, i * 0.09)); },
  error() { this.tone(185, 0.22, 'sawtooth', 0.05); this.tone(140, 0.3, 'sawtooth', 0.045, 0.09); },
  unlock() { [392, 523, 659, 880].forEach((f, i) => this.tone(f, 0.24, 'sine', 0.08, i * 0.1)); },
};

/* ---------- 게임 상태 & 저장 ---------- */
const SAVE_KEY = 'is1escape_save_v1';

function newState() {
  return {
    screen: 'start',        // start | prologue | game | result
    room: 1,                // 1~4 | 'final'
    prologueDone: false,
    solved: {},             // { puzzleId: true }
    items: {},              // { itemId: 'owned' | 'used' }
    counts: {},             // { itemId: n } (count형 아이템)
    flags: {},              // 오브젝트 1회성 이벤트
    hintLv: {},             // { puzzleId: 0~3 }
    hintCount: 0,
    wrongCount: 0,
    settings: { sound: false },
    playMs: 0,
    lastTick: Date.now(),
    escaped: false,
    startedAt: Date.now(),
  };
}

let state = newState();

function tickTime() {
  const now = Date.now();
  if (state.screen !== 'start' && !state.escaped) {
    state.playMs += Math.max(0, now - state.lastTick);
  }
  state.lastTick = now;
}

function saveGame() {
  tickTime();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 */ }
}
function hasSavedGame() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object' || !s.solved) return false;
    state = Object.assign(newState(), s);
    state.settings = Object.assign({ sound: false }, s.settings);
    state.lastTick = Date.now();
    return true;
  } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* noop */ }
}
function isSolved(id) { return !!state.solved[id]; }

function markSolved(pid) {
  if (state.solved[pid]) return;
  state.solved[pid] = true;
  saveGame();
  renderRoom();
  renderTopbar();
}

/* ---------- 아이템 / 인벤토리 ---------- */
function itemDef(id) { return ITEM_DEFS.find(d => d.id === id); }
function hasItem(id) { return state.items[id] === 'owned' || state.items[id] === 'used'; }
function itemCount(id) { return state.counts[id] || 0; }

function gainItem(id, n = 1) {
  const def = itemDef(id);
  if (!def) return;
  if (def.count) {
    state.counts[id] = Math.min(def.max, (state.counts[id] || 0) + n);
    state.items[id] = 'owned';
    toast(`${def.name} ${n}개 획득 (${state.counts[id]}/${def.max})`);
  } else {
    if (state.items[id]) return;
    state.items[id] = 'owned';
    toast(`획득: ${def.name}`);
  }
  saveGame();
  renderInventory();
  renderTopbar();
}
function useItem(id) {
  if (state.items[id] === 'owned') {
    state.items[id] = 'used';
    saveGame();
    renderInventory();
  }
}

function renderInventory() {
  const grid = $('#inv-grid');
  if (!grid) return;
  grid.innerHTML = '';
  ITEM_DEFS.forEach(def => {
    const st = state.items[def.id]; // undefined | 'owned' | 'used'
    const locked = !st;
    const label = locked ? '???' : def.name;
    const badge = st === 'used' ? '<span class="inv-badge">사용됨</span>' :
      st === 'owned' ? '<span class="inv-badge">보유</span>' :
      '<span class="inv-badge" aria-hidden="true">🔒</span>';
    const count = def.count && st ? `<span class="inv-count">×${itemCount(def.id)}</span>` : '';
    const b = el(`<button type="button" class="inv-item ${locked ? 'locked' : st}" aria-label="${esc(locked ? '아직 획득하지 않은 아이템' : def.name)}">
      ${badge}${svgIcon(def.icon, 'inv-icon')}<span class="inv-name">${esc(label)}</span>${count}</button>`);
    b.addEventListener('click', () => openItemDetail(def.id));
    grid.appendChild(b);
  });
}

function openItemDetail(id) {
  const def = itemDef(id);
  const st = state.items[id];
  if (!st) {
    openModal({
      title: '잠긴 아이템',
      body: `<div class="item-detail">${svgIcon('clue', 'id-icon')}<p>아직 획득하지 않은 아이템입니다.<br>방 안을 더 조사해 보세요.</p></div>`,
    });
    return;
  }
  const statusText = st === 'used' ? '이미 사용함 (기록 보관)' : '획득함';
  const countText = def.count ? ` · ${itemCount(id)}/${def.max}개` : '';
  openModal({
    title: def.name,
    body: `<div class="item-detail">
      ${svgIcon(def.icon, 'id-icon')}
      <span class="id-status">${esc(statusText)}${esc(countText)}</span>
      <div class="id-desc">${esc(def.desc).replace(/\n/g, '<br>')}</div>
    </div>`,
  });
}

/* ---------- 토스트 ---------- */
function toast(msg) {
  const root = $('#toast-root');
  if (!root) return;
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  root.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 400);
  }, 2600);
}

/* ---------- 모달 ---------- */
let modalPrevFocus = null;
let modalOnClose = null;
let activeHintId = null;

function openModal(opts) {
  closeModal(true);
  modalPrevFocus = document.activeElement;
  modalOnClose = opts.onClose || null;
  activeHintId = opts.hintId || activeHintId;
  const root = $('#modal-root');
  root.classList.remove('hidden');
  root.innerHTML = '';
  const panel = el(`<div class="modal ${opts.className || ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.title || '창')}">
    <div class="modal-head">
      <div><h2>${esc(opts.title || '')}</h2>${opts.sub ? `<p class="modal-sub">${esc(opts.sub)}</p>` : ''}</div>
      <div class="modal-head-btns">
        ${opts.hintId ? '<button class="btn btn-ghost btn-small btn-hint" type="button">💡 힌트</button>' : ''}
        <button class="btn btn-ghost btn-small modal-close" type="button" aria-label="닫기">✕ 닫기</button>
      </div>
    </div>
    <div class="modal-body"></div>
  </div>`);
  const bodyBox = $('.modal-body', panel);
  if (typeof opts.body === 'string') bodyBox.innerHTML = opts.body;
  else if (opts.body) bodyBox.appendChild(opts.body);
  root.appendChild(panel);
  $('.modal-close', panel).addEventListener('click', () => closeModal());
  const hintBtn = $('.btn-hint', panel);
  if (hintBtn) hintBtn.addEventListener('click', () => openHintPopup(opts.hintId));
  root.onmousedown = (e) => { if (e.target === root) closeModal(); };
  panel.addEventListener('keydown', trapFocus);
  $('.modal-close', panel).focus();
  return panel;
}

function setModalBody(content) {
  const bodyBox = $('#modal-root .modal-body');
  if (!bodyBox) return;
  bodyBox.innerHTML = '';
  if (typeof content === 'string') bodyBox.innerHTML = content;
  else bodyBox.appendChild(content);
}

function closeModal(silent) {
  const root = $('#modal-root');
  if (!root || root.classList.contains('hidden')) return;
  root.classList.add('hidden');
  root.innerHTML = '';
  const cb = modalOnClose;
  modalOnClose = null;
  if (!silent && modalPrevFocus && document.contains(modalPrevFocus)) {
    try { modalPrevFocus.focus(); } catch (e) { /* noop */ }
  }
  if (!silent && cb) cb();
}

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const panel = e.currentTarget;
  const focusables = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', panel)
    .filter(x => !x.disabled && x.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const hint = $('#hint-pop');
    if (hint) { hint.remove(); return; }
    closeModal();
  }
});

/* ---------- 힌트 ---------- */
function openHintPopup(pid) {
  const hints = HINTS[pid];
  if (!hints) { toast('이 단계에는 힌트가 없습니다.'); return; }
  const cur = state.hintLv[pid] || 0;
  const next = Math.min(cur + 1, 3);
  if (next > cur) {
    state.hintLv[pid] = next;
    state.hintCount++;
    saveGame();
    renderTopbar();
  }
  const old = $('#hint-pop');
  if (old) old.remove();
  const box = el(`<div id="hint-pop" role="dialog" aria-label="힌트">
    <div class="hint-head"><strong>💡 힌트 ${next}/3 단계</strong>
    <button class="btn btn-ghost btn-small" id="hint-close" type="button" aria-label="힌트 닫기">✕</button></div>
    <ol>${hints.slice(0, next).map(h => `<li>${esc(h)}</li>`).join('')}</ol>
    ${next < 3 ? '<button class="btn btn-small" id="hint-more" type="button">다음 단계 힌트 보기</button>'
      : '<p class="hint-max">마지막 단계 힌트입니다.</p>'}
  </div>`);
  document.body.appendChild(box);
  $('#hint-close', box).addEventListener('click', () => box.remove());
  const more = $('#hint-more', box);
  if (more) more.addEventListener('click', () => openHintPopup(pid));
  $('#hint-close', box).focus();
}

/* ---------- 정답/오답 공통 ---------- */
function recordWrong(msg, box) {
  state.wrongCount++;
  saveGame();
  Sound.error();
  if (box) {
    box.className = 'feedback fb-err';
    box.innerHTML = `<span class="fb-icon" aria-hidden="true">✖</span><div><strong>다시 생각해 보세요</strong><p>${esc(msg)}</p></div>`;
    box.classList.remove('pop');
    void box.offsetWidth;
    box.classList.add('pop');
  } else {
    toast('오답입니다. 다시 시도해 보세요.');
  }
}
function showOk(box, msg) {
  if (box) {
    box.className = 'feedback fb-ok pop';
    box.innerHTML = `<span class="fb-icon" aria-hidden="true">✔</span><div><strong>정답!</strong>${msg ? `<p>${esc(msg)}</p>` : ''}</div>`;
  }
  Sound.success();
}
function lockPuzzle(root) {
  $$('.game-card, .particle, .seg-btn, .cyc-btn, .key, input, [data-act]', root).forEach(b => {
    b.disabled = true;
    if (b.draggable) b.draggable = false;
  });
}

/* ============================================================
   퍼즐 공통 빌더
   ============================================================ */

/* 순서 배열 퍼즐 (카드 → 번호 슬롯) */
function buildOrderPuzzle(cfg) {
  const root = el(`<div class="puzzle order-puzzle">
    ${cfg.prompt ? `<div class="puzzle-prompt">${cfg.prompt}</div>` : ''}
    <div class="order-slots" role="list" aria-label="순서 배열 칸"></div>
    <p class="pool-label">카드를 클릭하면 다음 빈 칸에 놓입니다. 놓인 카드를 클릭하면 되돌아옵니다. (끌어다 놓기 가능)</p>
    <div class="card-pool" aria-label="카드 보관함"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions">
      <button type="button" class="btn" data-act="reset">초기화</button>
      <button type="button" class="btn btn-primary" data-act="check">${esc(cfg.checkLabel || '순서 확인')}</button>
    </div>
  </div>`);
  const slotsBox = $('.order-slots', root);
  const pool = $('.card-pool', root);
  const fb = $('.feedback', root);
  const n = cfg.answer.length;
  const slots = [];
  if (cfg.fixedFirst) {
    slotsBox.appendChild(el(`<div class="order-slot fixed" role="listitem"><span class="slot-num">시작</span><div class="locked-card">${esc(cfg.fixedFirst)}</div></div>`));
  }
  for (let i = 0; i < n; i++) {
    const s = el(`<div class="order-slot" role="listitem"><span class="slot-num">${i + 1}단계</span><div class="slot-drop" data-i="${i}"></div></div>`);
    slotsBox.appendChild(s);
    slots.push({ drop: $('.slot-drop', s), card: null });
  }
  const cards = {};
  shuffle(cfg.cards).forEach(c => {
    const b = el(`<button type="button" class="game-card" draggable="true" data-card="${c.id}">${esc(c.label)}</button>`);
    cards[c.id] = b;
    pool.appendChild(b);
    b.addEventListener('click', () => {
      Sound.click();
      if (b.parentElement === pool) {
        const s = slots.find(x => !x.card);
        if (!s) { toast('빈 칸이 없습니다. 카드를 먼저 되돌려 주세요.'); return; }
        place(c.id, s);
      } else {
        unplace(c.id);
      }
    });
    b.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', c.id);
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  function place(id, slot) {
    if (slot.card) unplace(slot.card);
    const prev = slots.find(x => x.card === id);
    if (prev) prev.card = null;
    slot.card = id;
    slot.drop.appendChild(cards[id]);
  }
  function unplace(id) {
    const s = slots.find(x => x.card === id);
    if (s) s.card = null;
    pool.appendChild(cards[id]);
  }
  slots.forEach(s => {
    s.drop.addEventListener('dragover', e => { e.preventDefault(); s.drop.classList.add('drag-over'); });
    s.drop.addEventListener('dragleave', () => s.drop.classList.remove('drag-over'));
    s.drop.addEventListener('drop', e => {
      e.preventDefault();
      s.drop.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (cards[id]) place(id, s);
    });
  });
  pool.addEventListener('dragover', e => e.preventDefault());
  pool.addEventListener('drop', e => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    if (cards[id]) unplace(id);
  });
  $('[data-act=reset]', root).addEventListener('click', () => {
    cfg.cards.forEach(c => unplace(c.id));
    fb.className = 'feedback'; fb.innerHTML = '';
  });
  $('[data-act=check]', root).addEventListener('click', () => {
    if (slots.some(s => !s.card)) { toast('모든 칸을 채운 뒤 확인하세요.'); return; }
    const seq = slots.map(s => s.card);
    if (seq.every((id, i) => id === cfg.answer[i])) {
      showOk(fb, cfg.okMsg);
      lockPuzzle(root);
      cfg.onCorrect(root);
    } else {
      recordWrong(cfg.wrongMsg, fb);
    }
  });
  return root;
}

/* 분류/배치 퍼즐 (카드 → 상자) */
function buildAssignPuzzle(cfg) {
  const root = el(`<div class="puzzle assign-puzzle">
    ${cfg.prompt ? `<div class="puzzle-prompt">${cfg.prompt}</div>` : ''}
    <div class="bins ${cfg.binClass || ''}"></div>
    <p class="pool-label">${esc(cfg.poolLabel || '카드를 클릭해 선택한 뒤 놓을 상자를 클릭하세요. 상자 안의 카드를 클릭하면 되돌아옵니다. (끌어다 놓기 가능)')}</p>
    <div class="card-pool" aria-label="카드 보관함"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions">
      <button type="button" class="btn" data-act="reset">초기화</button>
      <button type="button" class="btn btn-primary" data-act="check">${esc(cfg.checkLabel || '배치 확인')}</button>
    </div>
  </div>`);
  const binsBox = $('.bins', root);
  const pool = $('.card-pool', root);
  const fb = $('.feedback', root);
  const binEls = {};
  const cardEls = {};
  const loc = {}; // cardId -> binId | null
  let selected = null;

  cfg.bins.forEach(b => {
    const bel = el(`<div class="bin" data-bin="${b.id}" tabindex="0" role="group" aria-label="${esc(b.label)}">
      <div class="bin-head">${b.html || ''}<span class="bin-label">${esc(b.label)}</span>${b.desc ? `<span class="bin-desc">${esc(b.desc)}</span>` : ''}</div>
      <div class="bin-drop"></div>
    </div>`);
    binsBox.appendChild(bel);
    binEls[b.id] = bel;
    const putSelected = () => {
      if (selected && loc[selected] === null) {
        placeCard(selected, b.id);
        setSelected(null);
        Sound.click();
      }
    };
    bel.addEventListener('click', e => { if (!e.target.closest('.game-card')) putSelected(); });
    bel.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target === bel) { e.preventDefault(); putSelected(); }
    });
    bel.addEventListener('dragover', e => { e.preventDefault(); bel.classList.add('drag-over'); });
    bel.addEventListener('dragleave', () => bel.classList.remove('drag-over'));
    bel.addEventListener('drop', e => {
      e.preventDefault();
      bel.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (cardEls[id]) placeCard(id, b.id);
    });
  });

  shuffle(cfg.cards).forEach(c => {
    const cel = el(`<button type="button" class="game-card" draggable="true" data-card="${c.id}">${c.html || esc(c.label)}</button>`);
    cardEls[c.id] = cel;
    loc[c.id] = null;
    pool.appendChild(cel);
    cel.addEventListener('click', () => {
      Sound.click();
      if (loc[c.id]) { placeCard(c.id, null); setSelected(null); }
      else setSelected(selected === c.id ? null : c.id);
    });
    cel.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', c.id);
      setSelected(null);
    });
  });
  pool.addEventListener('dragover', e => e.preventDefault());
  pool.addEventListener('drop', e => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    if (cardEls[id]) placeCard(id, null);
  });

  function setSelected(id) {
    selected = id;
    Object.entries(cardEls).forEach(([cid, elm]) => elm.classList.toggle('selected', cid === selected));
  }
  function placeCard(id, binId) {
    if (binId) {
      const b = cfg.bins.find(x => x.id === binId);
      const cap = b.cap || Infinity;
      const inBin = Object.keys(loc).filter(k => loc[k] === binId);
      if (inBin.length >= cap) placeCard(inBin[0], null);
      loc[id] = binId;
      $('.bin-drop', binEls[binId]).appendChild(cardEls[id]);
    } else {
      loc[id] = null;
      pool.appendChild(cardEls[id]);
    }
  }

  $('[data-act=reset]', root).addEventListener('click', () => {
    Object.keys(cardEls).forEach(id => placeCard(id, null));
    setSelected(null);
    fb.className = 'feedback'; fb.innerHTML = '';
  });
  $('[data-act=check]', root).addEventListener('click', () => {
    let ok = true;
    for (const b of cfg.bins) {
      const want = (cfg.answer[b.id] || []).slice().sort();
      const got = Object.keys(loc).filter(k => loc[k] === b.id).sort();
      if (want.length !== got.length || want.some((v, i) => v !== got[i])) { ok = false; break; }
    }
    if (ok) {
      showOk(fb, cfg.okMsg);
      lockPuzzle(root);
      cfg.onCorrect(root);
    } else {
      const placedCount = Object.values(loc).filter(v => v).length;
      const needCount = Object.values(cfg.answer).reduce((a, v) => a + v.length, 0);
      if (placedCount < needCount) { toast('아직 배치하지 않은 카드가 있습니다.'); return; }
      const msg = typeof cfg.wrong === 'function' ? cfg.wrong(loc) : cfg.wrong;
      recordWrong(msg, fb);
    }
  });
  return root;
}

/* 숫자 키패드 자물쇠 */
function buildKeypad(cfg) {
  const root = el(`<div class="puzzle keypad-puzzle">
    ${cfg.prompt ? `<div class="puzzle-prompt">${cfg.prompt}</div>` : ''}
    ${cfg.note ? `<p class="puzzle-note">${cfg.note}</p>` : ''}
    <div class="code-display" aria-label="입력한 암호"></div>
    <div class="keypad"></div>
    <div class="feedback" aria-live="polite"></div>
  </div>`);
  const disp = $('.code-display', root);
  const pad = $('.keypad', root);
  const fb = $('.feedback', root);
  let val = '';
  function render() {
    disp.innerHTML = Array.from({ length: cfg.digits }, (_, i) =>
      `<span class="code-cell ${i === val.length ? 'cur' : ''}">${val[i] || ''}</span>`).join('');
  }
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '지움', '0', '확인'].forEach(k => {
    const b = el(`<button type="button" class="key ${k === '확인' ? 'key-ok' : ''} ${k === '지움' ? 'key-del' : ''}">${k}</button>`);
    pad.appendChild(b);
    b.addEventListener('click', () => {
      Sound.click();
      if (k === '지움') { val = val.slice(0, -1); }
      else if (k === '확인') {
        if (val.length < cfg.digits) { toast(`${cfg.digits}자리를 모두 입력하세요.`); return; }
        if (val === cfg.code) {
          showOk(fb, cfg.okMsg);
          Sound.unlock();
          lockPuzzle(root);
          cfg.onCorrect(root);
        } else {
          recordWrong(cfg.wrongMsg, fb);
          val = '';
        }
      } else if (val.length < cfg.digits) { val += k; }
      render();
    });
  });
  render();
  return root;
}

/* 회전식(사이클) 선택기 — 옵션을 ◀ ▶ 로 돌려 선택 */
function buildCycler(cfg) {
  // cfg: {label, options: [{id, label, html}], startIndex, num}
  let idx = cfg.startIndex || 0;
  const root = el(`<div class="cycler">
    <span class="cyc-label">${esc(cfg.label)}</span>
    <div class="cyc-ctrl">
      <button type="button" class="cyc-btn" aria-label="${esc(cfg.label)} 이전 값">◀</button>
      <div class="cyc-val ${cfg.num ? 'num' : ''}" aria-live="polite"></div>
      <button type="button" class="cyc-btn" aria-label="${esc(cfg.label)} 다음 값">▶</button>
    </div>
  </div>`);
  const val = $('.cyc-val', root);
  const [prev, next] = $$('.cyc-btn', root);
  function render() {
    const o = cfg.options[idx];
    val.innerHTML = o.html ? `<span class="cyc-icon" aria-hidden="true">${o.html}</span><span class="cyc-text">${esc(o.label)}</span>` :
      cfg.num ? esc(o.label) : `<span class="cyc-text">${esc(o.label)}</span>`;
    val.setAttribute('aria-label', `${cfg.label}: ${o.label}`);
  }
  prev.addEventListener('click', () => { Sound.click(); idx = (idx - 1 + cfg.options.length) % cfg.options.length; render(); });
  next.addEventListener('click', () => { Sound.click(); idx = (idx + 1) % cfg.options.length; render(); });
  render();
  return { root, get: () => cfg.options[idx].id };
}

/* 세그먼트(다중 보기 중 1개 선택) */
function buildSegGroup(cfg) {
  // cfg: {title, desc, options: [{id, html|label}]}
  const root = el(`<div class="seg-group" role="radiogroup" aria-label="${esc(cfg.title)}">
    <span class="seg-title">${esc(cfg.title)}</span>
    ${cfg.desc ? `<p class="seg-desc">${esc(cfg.desc)}</p>` : ''}
    <div class="seg"></div>
  </div>`);
  const segBox = $('.seg', root);
  let value = null;
  cfg.options.forEach(o => {
    const b = el(`<button type="button" class="seg-btn" role="radio" aria-checked="false" data-opt="${o.id}">${o.html || esc(o.label)}</button>`);
    segBox.appendChild(b);
    b.addEventListener('click', () => {
      Sound.click();
      value = o.id;
      $$('.seg-btn', segBox).forEach(x => {
        x.classList.toggle('on', x === b);
        x.setAttribute('aria-checked', x === b ? 'true' : 'false');
      });
    });
  });
  return { root, get: () => value };
}


'use strict';
/* ============================================================
   puzzles.js — 방 1~4 오브젝트 조사 및 퍼즐 구현
   ============================================================ */

const R1_CARDS = ['card-quark', 'card-nucleon', 'card-henuc', 'card-atom'];

/* ---------- 공통 소도구 ---------- */
function infoModal(title, sub, html) {
  openModal({ title, sub, body: html });
}
function contBtn(label, fn, center) {
  const wrap = el(`<div class="puzzle-actions"${center ? ' style="justify-content:center"' : ''}><button type="button" class="btn btn-primary">${esc(label)}</button></div>`);
  $('button', wrap).addEventListener('click', () => { Sound.click(); fn(); });
  return wrap;

/* ---------- 스펙트럼 SVG ---------- */
let specUid = 0;
const SPEC_H_LINES = [40, 95, 185];
const SPEC_HE_LINES = [60, 130, 215];
const SPEC_NA_LINES = [80, 160];
const SPEC_CA_LINES = [110, 240];

function spectrumSVG(kind, lines = []) {
  const id = 'rb' + (++specUid);
  const W = 260, H = 40;
  const grad = `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a4dff"/><stop offset="0.2" stop-color="#3d6bff"/>
    <stop offset="0.4" stop-color="#2fd06e"/><stop offset="0.6" stop-color="#ffe14d"/>
    <stop offset="0.8" stop-color="#ff8c3a"/><stop offset="1" stop-color="#ff4040"/>
  </linearGradient>`;
  const lineColor = x => `hsl(${270 - (x / W) * 270}, 95%, 62%)`;
  let bg, marks = '';
  if (kind === 'cont') {
    bg = `<rect width="${W}" height="${H}" fill="url(#${id})"/>`;
  } else if (kind === 'emit') {
    bg = `<rect width="${W}" height="${H}" fill="#05070d"/>`;
    marks = lines.map(x => `<rect x="${x - 1.6}" width="3.2" height="${H}" fill="${lineColor(x)}"/>`).join('');
  } else { // abs
    bg = `<rect width="${W}" height="${H}" fill="url(#${id})"/>`;
    marks = lines.map(x => `<rect x="${x - 1.6}" width="3.2" height="${H}" fill="#020308"/>`).join('');
  }
  return `<svg class="spec-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind === 'cont' ? '연속 스펙트럼' : kind === 'emit' ? '방출 스펙트럼(검은 바탕에 밝은 선)' : '흡수 스펙트럼(무지개 바탕에 검은 선)'}"><defs>${grad}</defs>${bg}${marks}<rect width="${W}" height="${H}" fill="none" stroke="rgba(140,180,240,.5)"/></svg>`;
}

      <p>저울이 측정값을 표시하고 있다.</p>
      <div class="clear-summary"><p>수소 원자핵 : 헬륨 원자핵의 질량비 = <strong>3 : 1</strong></p></div>
      <p>단서 표시등: <strong style="color:var(--warn);font-size:1.3em">3 1</strong></p>`);
    return;
  }
  const root = el(`<div class="puzzle">
    <div class="puzzle-prompt">“초기 우주에는 <strong>양성자가 중성자보다 훨씬 많았습니다.</strong><br>

    <p class="puzzle-note">※ 이 모형은 초기 우주의 입자 구성을 학습하기 위해 단순화한 모형입니다.
    양성자(붉은색)와 중성자(회색)는 클릭하거나 끌어서 옮길 수 있습니다. 작은 푸른 입자는 자유 전자, 〰는 빛입니다.</p>
    <div class="particle-stage">
      <div class="particle-zone" data-zone="pool">
        <span class="pz-title">빅뱅 후 약 3분이 되기 전의 초기 우주</span>
        <div class="pz-body"></div>
      </div>
      <div class="particle-zone assembly" data-zone="asm">
        <span class="pz-title">헬륨 원자핵 조립 영역</span>
        <div class="pz-body"></div>
      </div>
    </div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions"><button type="button" class="btn btn-primary" data-act="fuse">⚡ 핵융합 실행</button></div>
  </div>`);
  const poolBody = $('[data-zone=pool] .pz-body', root);
  const asmBody = $('[data-zone=asm] .pz-body', root);
  const fb = $('.feedback', root);

  function makeParticle(type, i) {
    const label = type === 'p' ? '양성자' : '중성자';
    const b = el(`<button type="button" class="particle pt-${type}" draggable="true" data-pt="${type}" aria-label="${label}">${type === 'p' ? 'p' : 'n'}</button>`);
    b.addEventListener('click', () => {
      if (b.disabled) return;
      Sound.click();
      (b.parentElement === poolBody ? asmBody : poolBody).appendChild(b);
    });
    b.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', `pt-${type}-${i}`));
    b.dataset.key = `pt-${type}-${i}`;
    return b;
  }
  const particles = [];
  for (let i = 0; i < 14; i++) particles.push(makeParticle('p', i));
  for (let i = 0; i < 2; i++) particles.push(makeParticle('n', 100 + i));
  shuffle(particles).forEach(p => poolBody.appendChild(p));
  for (let i = 0; i < 6; i++) {
    const e = el('<button type="button" class="particle pt-e" aria-label="자유 전자">e</button>');

    poolBody.appendChild(w);
  }
  [[poolBody, 'pool'], [asmBody, 'asm']].forEach(([zone]) => {
    zone.parentElement.addEventListener('dragover', e => e.preventDefault());
    zone.parentElement.addEventListener('drop', e => {
      e.preventDefault();
      const key = e.dataTransfer.getData('text/plain');
      const p = particles.find(x => x.dataset.key === key);
      if (p && !p.disabled) zone.appendChild(p);
    });
  });
  $('[data-act=fuse]', root).addEventListener('click', () => {
    const pN = $$('.pt-p', asmBody).length;
    const nN = $$('.pt-n', asmBody).length;

      $$('.particle', asmBody).forEach(x => x.remove());
      asmBody.appendChild(el('<div class="he-core" role="img" aria-label="헬륨 원자핵"><span class="hp"></span><span class="hn"></span><span class="hn"></span><span class="hp"></span></div>'));
      $$('.pt-p', poolBody).forEach(x => { x.classList.add('h-label'); x.disabled = true; });
      $$('.particle', root).forEach(x => { x.draggable = false; if (x.dataset.pt) x.disabled = true; });

      root.appendChild(contBtn('닫기', () => closeModal(), true));

      recordWrong(FEEDBACK.ratioSimplify, fb);
    } else {
      recordWrong(FEEDBACK.ratio, fb);
    }
  });
  return root;
}

function lightStage3() {
  const options = [
    { id: 'op-3min', label: '3분' },
    { id: 'op-38man', label: '38만 년' },
    { id: 'op-3000k', label: '3000 K' },
    { id: 'op-1e9k', label: '10억 K' },
    { id: 'op-atom', label: '원자' },
    { id: 'op-nuc', label: '원자핵' },
    { id: 'op-star', label: '별' },
    { id: 'op-galaxy', label: '은하' },
  ];
  const root = el(`<div class="puzzle">
    <div class="puzzle-prompt">실험 결과를 바탕으로, 카드를 끌어(또는 클릭해) 문장의 빈칸을 완성하세요.</div>
    <div class="blank-sentence">
      우주의 나이가 약 <span class="blank-slot" data-bl="bl-age" tabindex="0" aria-label="첫 번째 빈칸: 우주의 나이"></span> 이 되었을 때,
      우주의 온도는 약 <span class="blank-slot" data-bl="bl-temp" tabindex="0" aria-label="두 번째 빈칸: 우주의 온도"></span> 로 낮아졌고,
      전자가 원자핵과 결합하여 <span class="blank-slot" data-bl="bl-what" tabindex="0" aria-label="세 번째 빈칸"></span> 가 만들어졌다.<br>
      그 결과 빛이 우주 공간을 자유롭게 이동할 수 있게 되었다.
    </div>
    <div class="card-pool" aria-label="선택 카드"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions"><button type="button" class="btn btn-primary" data-act="check">문장 완성 확인</button></div>
  </div>`);
  const pool = $('.card-pool', root);
  const fb = $('.feedback', root);
  const cardEls = {};
  const loc = {};
  let selected = null;
  function setSelected(id) {
    selected = id;
    Object.entries(cardEls).forEach(([cid, e]) => e.classList.toggle('selected', cid === selected));
  }
  function place(id, bl) {
    if (bl) {
      const slot = $(`.blank-slot[data-bl=${bl}]`, root);
      const cur = Object.keys(loc).find(k => loc[k] === bl);
      if (cur) { loc[cur] = null; pool.appendChild(cardEls[cur]); }
      loc[id] = bl;
      slot.appendChild(cardEls[id]);
    } else {
      loc[id] = null;
      pool.appendChild(cardEls[id]);
    }
  }
  shuffle(options).forEach(o => {
    const c = el(`<button type="button" class="game-card" draggable="true" data-card="${o.id}">${esc(o.label)}</button>`);
    cardEls[o.id] = c;
    loc[o.id] = null;
    pool.appendChild(c);
    c.addEventListener('click', () => {
      Sound.click();
      if (loc[o.id]) { place(o.id, null); setSelected(null); }
      else setSelected(selected === o.id ? null : o.id);
    });
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', o.id); setSelected(null); });
  });
  $$('.blank-slot', root).forEach(slot => {
    const putSelected = () => {
      if (selected && loc[selected] === null) { place(selected, slot.dataset.bl); setSelected(null); Sound.click(); }
    };
    slot.addEventListener('click', e => { if (!e.target.closest('.game-card')) putSelected(); });
    slot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); putSelected(); } });
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (cardEls[id]) place(id, slot.dataset.bl);
    });
  });
  pool.addEventListener('dragover', e => e.preventDefault());
  pool.addEventListener('drop', e => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    if (cardEls[id]) place(id, null);
  });
  $('[data-act=check]', root).addEventListener('click', () => {
    const blanks = Object.keys(ANSWERS.blanks);
    if (blanks.some(bl => !Object.values(loc).includes(bl))) { toast('빈칸을 모두 채운 뒤 확인하세요.'); return; }
    const ok = blanks.every(bl => loc[ANSWERS.blanks[bl]] === bl);
    if (ok) {
      showOk(fb, '약 38만 년 · 약 3000 K · 원자!');
      lockPuzzle(root);
      root.appendChild(el(`<div class="success-panel nova-flash">
        <span class="success-icon" aria-hidden="true">🌌</span>
        <h3>빛이 우주 공간으로 퍼져 나갑니다!</h3>
        <p>이 빛은 우주가 팽창하며 식는 동안 파장이 점점 길어져,</p>
        <p>오늘날 우주 전역에서 관측됩니다. 그렇다면…</p>
      </div>`));
      root.appendChild(contBtn('마지막 확인 문제 →', () => setModalBody(lightStage4()), true));
    } else {
      recordWrong(FEEDBACK.blanks, fb);
    }
  });
  return root;
}

function starSVG(size, color, label) {
  return `<svg viewBox="0 0 60 60" width="${size}" height="${size}" role="img" aria-label="${label}">
    <circle cx="30" cy="30" r="24" fill="${color}" opacity="0.14"/>
    <circle cx="30" cy="30" r="15" fill="${color}" opacity="0.55"/>
    <circle cx="30" cy="30" r="9" fill="#fff" opacity="0.85"/>
  </svg>`;
}

function grantPieces(flag, n, place) {
  if (state.flags[flag]) return `<p>필름 조각은 이미 회수했다. (${itemCount('film-piece')}/6)</p>`;
  state.flags[flag] = true;
  gainItem('film-piece', n);
  return `<p>🎞️ ${esc(place)}에서 <strong>필름 조각 ${n}개</strong>를 발견했다! (${itemCount('film-piece')}/6)</p>`;
}

      <p>반응기가 안정적으로 가동 중이다.</p>

      <p>발급된 <strong>핵융합 인증판(4)</strong>은 인벤토리에 있다.</p>`);
    return;
  }
  const root = el(`<div class="puzzle">
    <div class="puzzle-prompt">“원시별 중심부의 온도가 약 <strong>1000만 K</strong> 이상으로 높아졌다.

    헬륨 원자핵 1개가 생성되도록, 필요한 만큼의 수소 원자핵을 반응기에 넣으세요.</div>
    <p class="puzzle-note">수소 원자핵(H)을 클릭하거나 끌어서 반응기에 넣습니다.</p>
    <div class="particle-stage">
      <div class="particle-zone" data-zone="pool"><span class="pz-title">수소 원자핵 공급 장치</span><div class="pz-body"></div></div>
      <div class="particle-zone assembly" data-zone="asm"><span class="pz-title">핵융합 반응기 투입구</span><div class="pz-body"></div></div>
    </div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions"><button type="button" class="btn btn-primary" data-act="fuse">⚡ 핵융합 시작</button></div>
  </div>`);
  const poolBody = $('[data-zone=pool] .pz-body', root);
  const asmBody = $('[data-zone=asm] .pz-body', root);
  const fb = $('.feedback', root);
  const hs = [];
  for (let i = 0; i < 8; i++) {
    const b = el(`<button type="button" class="particle pt-p" draggable="true" data-key="h${i}" aria-label="수소 원자핵">H</button>`);
    b.addEventListener('click', () => {
      if (b.disabled) return;
      Sound.click();
      (b.parentElement === poolBody ? asmBody : poolBody).appendChild(b);
    });
    b.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', `h${i}`));
    hs.push(b);
    poolBody.appendChild(b);
  }
  [[poolBody], [asmBody]].forEach(([zone]) => {
    zone.parentElement.addEventListener('dragover', e => e.preventDefault());
    zone.parentElement.addEventListener('drop', e => {
      e.preventDefault();
      const p = hs.find(x => x.dataset.key === e.dataTransfer.getData('text/plain'));
      if (p && !p.disabled) zone.appendChild(p);
    });
  });
  $('[data-act=fuse]', root).addEventListener('click', () => {
    const n = $$('.pt-p', asmBody).length;
    if (n === ANSWERS.fusionCount) {
      showOk(fb, '수소 원자핵 4개 → 헬륨 원자핵 1개 + 에너지!');
      $$('.pt-p', asmBody).forEach(x => x.remove());
      asmBody.parentElement.classList.add('nova-flash');
      asmBody.appendChild(el('<div class="he-core" role="img" aria-label="생성된 헬륨 원자핵"><span class="hp"></span><span class="hn"></span><span class="hn"></span><span class="hp"></span></div>'));
      asmBody.appendChild(el('<span style="align-self:center;font-weight:800;color:var(--warn)">＋ 에너지 방출!</span>'));
      lockPuzzle(root);
      gainItem('cert4');
      markSolved('r2-fusion');
      root.appendChild(successBox('반응기 안정화', [
        '반응기가 「핵융합 인증판」을 발급했다. 숫자 4가 찍혀 있다.',
        '질량이 서로 다른 두 별의 내부 분석기가 활성화되었다!',
      ], '⚡'));
      root.appendChild(contBtn('닫기', () => closeModal(), true));
    } else if (n === 0) {
      toast('수소 원자핵을 먼저 반응기에 넣으세요.');
    } else {
      recordWrong(FEEDBACK.fusion, fb);
    }
  });
  openModal({ title: '퍼즐 · 수소 핵융합 반응기', sub: '별 내부의 에너지원', body: root, hintId: 'r2-fusion' });
}

    { id: 'el-o', label: '산소' }, { id: 'el-fe', label: '철' }, { id: 'el-heavy', label: '철보다 무거운 원소' },
  ];
  const digitOpts = Array.from({ length: 10 }, (_, i) => ({ id: 'd' + i, label: String(i) }));
  const dial = buildCycler({ label: '장치 ① 숫자 다이얼 — 헬륨 원자핵 1개에 필요한 수소 원자핵 수', options: digitOpts, num: true });
  const small = buildCycler({ label: '장치 ② 작은 별 — 태양과 비슷한 별의 최종 원소', options: elemOpts });
  const big = buildCycler({ label: '장치 ③ 큰 별 — 태양보다 훨씬 큰 별의 최종 원소', options: elemOpts });
  const slot = buildCycler({ label: '장치 ④ 초신성 카드 슬롯 — 폭발 과정에서 만들어지는 원소', options: elemOpts });
  const root = el(`<div class="puzzle">
    <div class="puzzle-prompt">핵융합 반응기형 <strong>복합 자물쇠</strong>. 네 장치를 모두 올바르게 설정해야 문이 열린다.</div>

  </div>`);
  const row = $('.cycler-row', root);
  [dial, small, big, slot].forEach(c => row.appendChild(c.root));
  const fb = $('.feedback', root);
  $('[data-act=check]', root).addEventListener('click', () => {
    const a = ANSWERS.r2lock;
    if (dial.get() !== 'd' + a.dial) { recordWrong(FEEDBACK.fusion, fb); return; }
    if (small.get() !== a.small || big.get() !== a.big) { recordWrong(FEEDBACK.starmass, fb); return; }

    showOk(fb, '복합 자물쇠 해제! 문이 열립니다.');

    markSolved('r2-door');

  openModal({ title: '출구 · 핵융합 반응기형 복합 자물쇠', sub: '방 2 최종 잠금장치', body: root, hintId: 'r2-door' });
}

    return;
  }
  const iconOpts = [
    { id: 'ic-cloud', label: '구름', html: ICONS.cloud },
    { id: 'ic-drop', label: '물방울', html: ICONS.droplet },
    { id: 'ic-rock', label: '암석', html: ICONS.rock },
    { id: 'ic-leaf', label: '잎', html: ICONS.leaf },
  ];
  const dials = ANSWERS.r3lock.map((_, i) =>
    buildCycler({ label: `${i + 1}번째 칸`, options: iconOpts, startIndex: (i + 1) % 4 }));
  const root = el(`<div class="puzzle">
    <div class="puzzle-prompt">4칸 <strong>권역 아이콘 회전식 자물쇠</strong>.<br>
    “탄소 캡슐이 이동한 권역의 순서대로 아이콘을 설정하라.”</div>
    <div class="cycler-row"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="puzzle-actions"><button type="button" class="btn btn-primary" data-act="check">🔓 자물쇠 해제 시도</button></div>
  </div>`);
  const row = $('.cycler-row', root);
  dials.forEach(d => row.appendChild(d.root));
  const fb = $('.feedback', root);
  $('[data-act=check]', root).addEventListener('click', () => {
    const ok = dials.every((d, i) => d.get() === ANSWERS.r3lock[i]);
    if (ok) {
      showOk(fb, '아이콘 자물쇠 해제! 문이 열립니다.');
      Sound.unlock();
      lockPuzzle(root);
      markSolved('r3-door');
      setTimeout(() => roomClearSequence(3), 700);
    } else {
      recordWrong(FEEDBACK.r3lock, fb);
    }
  });
  openModal({ title: '출구 · 권역 아이콘 자물쇠', sub: '방 3 최종 잠금장치', body: root, hintId: 'r3-door' });
}

/* --- 지진·화산 분포 지도 --- */
function quakeMapSVG() {
  // 시드 고정 의사난수 (항상 같은 지도)
  let seed = 42;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const quake = (x, y) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#ff6b6b" opacity="0.9"/>`;
  const volcano = (x, y) => `<path d="M${(x - 4).toFixed(1)} ${(y + 3.5).toFixed(1)} l4 -7 l4 7 z" fill="#ffab52"/>`;
  let dots = '';
  // 띠 1 (세로, 발산형): x≈120
  for (let i = 0; i < 26; i++) {
    const y = 40 + i * 10 + rnd() * 6;
    dots += quake(112 + rnd() * 20, y);
    if (i % 4 === 1) dots += volcano(114 + rnd() * 14, y + 3);
  }
  // 띠 2 (사선, 보존형): (262,60) → (338,278) — 지진만 활발
  for (let i = 0; i < 24; i++) {
    const t = i / 23;
    dots += quake(262 + t * 76 + (rnd() - 0.5) * 16, 60 + t * 218 + (rnd() - 0.5) * 12);
  }
  // 띠 3 (가로, 수렴형): y≈258
  for (let i = 0; i < 24; i++) {
    const x = 392 + i * 7 + rnd() * 4;
    dots += quake(x, 250 + rnd() * 18);
    if (i % 4 === 2) dots += volcano(x, 252 + rnd() * 10);
  }
  // 흩어진 잡음
  const noise = [[60, 60], [200, 40], [430, 60], [520, 120], [40, 200], [210, 300], [560, 40], [480, 170], [70, 300], [350, 30]];
  noise.forEach(([x, y]) => { dots += quake(x + rnd() * 10, y + rnd() * 10); });
  return `<svg viewBox="0 0 600 340" role="img" aria-label="지진(붉은 점)과 화산(주황 삼각형) 분포 지도. 세 곳에 점이 띠 모양으로 밀집해 있다.">
    <rect width="600" height="340" fill="#0a1a2e"/>
    <g fill="#14314f">
      <path d="M30 40 Q120 10 190 55 T90 150 Q30 120 30 40Z"/>
      <path d="M240 30 Q380 20 430 90 Q470 160 380 200 Q290 230 250 150 Q220 80 240 30Z"/>
      <path d="M60 230 Q160 210 210 260 Q240 310 140 320 Q50 310 60 230Z"/>
      <path d="M440 210 Q560 190 570 260 Q560 320 470 310 Q420 270 440 210Z"/>
    </g>
    <g class="belt-line" stroke="#ffd97a" stroke-width="3" stroke-dasharray="9 6" fill="none">
      <path d="M122 40 V300"/>
      <path d="M262 60 L338 278"/>
      <path d="M392 258 H560"/>
    </g>
    ${dots}
  </svg>`;
}
