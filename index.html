<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060b1a">
<title>통합과학 방탈출: 138억 년의 여정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript>
  <p class="noscript">이 게임은 JavaScript가 필요합니다. 브라우저에서 JavaScript를 켠 뒤 다시 열어 주세요.</p>
</noscript>

<div id="app">

  <!-- ===== 상단 바 ===== -->
  <header id="topbar" class="hidden">
    <div class="tb-left">
      <span class="tb-logo" aria-hidden="true">⏳</span>
      <div class="tb-titles">
        <strong>138억 년의 여정</strong>
        <span id="tb-loc">-</span>
      </div>
      <span id="tb-team" class="tb-team hidden" aria-label="반과 팀명"></span>
    </div>
    <div class="tb-mid">
      <div class="tb-progress" role="img" aria-label="현재 방 진행률">
        <div id="tb-progress-fill"></div>
      </div>
      <span id="tb-progress-text">0/5</span>
      <div id="tb-chips" aria-label="획득한 시간 좌표 칩"></div>
      <div class="tb-stab" role="img" aria-label="시공간 안정도">
        <span class="stab-label">시공간 안정도</span>
        <div class="stab-gauge"><div id="stab-fill"></div></div>
        <span class="stab-pct" id="stab-pct">100%</span>
      </div>
    </div>
    <div class="tb-right">
      <span id="tb-time" aria-label="플레이 시간">00:00</span>
      <button id="btn-hint" class="btn btn-ghost" type="button">💡 힌트</button>
      <button id="btn-sound" class="btn btn-ghost" type="button" aria-pressed="false">🔇 소리 꺼짐</button>
      <button id="btn-restart" class="btn btn-ghost" type="button">↻ 처음부터</button>
    </div>
  </header>

  <main id="screen-root">

    <!-- ===== 시작 화면 ===== -->
    <section id="screen-start" class="screen">
      <div class="start-stars" aria-hidden="true"></div>
      <div class="start-card">
        <p class="start-kicker">INTEGRATED SCIENCE ESCAPE ROOM</p>
        <h1 class="start-title">통합과학 방탈출<br><span>138억 년의 여정</span></h1>
        <p class="start-sub">흩어진 시간 좌표를 복구하고 현재로 돌아오세요.</p>
        <ul class="start-info">
          <li><strong>대상</strong> 통합과학1 · 1학기 복습</li>
          <li><strong>권장 인원</strong> 2~3명 (한 팀)</li>
          <li><strong>예상 시간</strong> 35~40분</li>
        </ul>
        <form class="start-reg" id="start-reg" autocomplete="off" novalidate>
          <label class="reg-field"><span>반</span>
            <input id="reg-class" type="text" maxlength="20" placeholder="예: 1학년 3반" autocomplete="off" enterkeyhint="next"></label>
          <label class="reg-field"><span>팀명</span>
            <input id="reg-team" type="text" maxlength="24" placeholder="예: 빅뱅탐험대" autocomplete="off" enterkeyhint="go"></label>
        </form>
        <p id="reg-msg" class="reg-msg" role="alert"></p>
        <div class="start-btns">
          <button id="btn-continue" class="btn btn-big" type="button" disabled>이어하기</button>
          <button id="btn-newgame" class="btn btn-big btn-primary" type="button">새 게임 시작</button>
          <button id="btn-howto" class="btn btn-big btn-ghost" type="button">조작 방법</button>
        </div>
        <p class="start-foot">범위: 우주 초기의 원소 · 별의 진화와 원소 생성 · 지구시스템 · 판 구조론</p>
      </div>
    </section>

    <!-- ===== 프롤로그 ===== -->
    <section id="screen-prologue" class="screen hidden">
      <div id="pro-fx" aria-hidden="true"></div>
      <div class="pro-box">
        <p id="pro-step" class="pro-step"></p>
        <span id="pro-icon" class="pro-icon" aria-hidden="true"></span>
        <h2 id="pro-title"></h2>
        <p id="pro-desc"></p>
        <div class="pro-btns">
          <button id="btn-pro-skip" class="btn btn-ghost" type="button">건너뛰기 ≫</button>
          <button id="btn-pro-next" class="btn btn-primary" type="button">다음</button>
        </div>
      </div>
    </section>

    <!-- ===== 게임 화면 ===== -->
    <section id="screen-game" class="screen hidden">
      <div id="game-layout">
        <div id="room-wrap">
          <div id="objective-bar">
            <span class="obj-tag">현재 목표</span>
            <span id="objective-text"></span>
          </div>
          <div id="comm-panel" aria-live="polite" aria-label="관제 AI 교신">
            <span class="comm-tag">K.O.S.M.O</span>
            <span id="comm-text"></span><span class="comm-cursor" aria-hidden="true">▊</span>
          </div>
          <div id="room-view"></div>
        </div>
        <aside id="side-panel">
          <details id="inv-details" open>
            <summary><span aria-hidden="true">🎒</span> 인벤토리 · 단서</summary>
            <p class="inv-help">아이템을 클릭하면 자세한 설명을 볼 수 있습니다.</p>
            <div id="inv-grid" class="inv-grid"></div>
          </details>
        </aside>
      </div>
    </section>

    <!-- ===== 결과 화면 ===== -->
    <section id="screen-result" class="screen hidden"></section>

  </main>

  <!-- 공통 모달 -->
  <div id="modal-root" class="hidden"></div>
  <!-- 연출 오버레이 (시간 터널 등) -->
  <div id="fx-overlay" class="hidden" aria-hidden="true"></div>
  <!-- 토스트 알림 -->
  <div id="toast-root" aria-live="polite"></div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/main.js"></script>
</body>
</html>
